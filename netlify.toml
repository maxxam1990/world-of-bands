# ============================================================
# WORLD OF BANDS FLORIDA — Netlify config
# Repo root is this folder. No build step; functions run on the
# Node runtime with zero npm dependencies (plain fetch).
# ============================================================

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pretty per-band portal URLs: /band/<token> serves band.html,
# which reads the token back out of location.pathname.
[[redirects]]
  from = "/band/*"
  to = "/band.html"
  status = 200

[[redirects]]
  from = "/school/*"
  to = "/school.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Official 2026 results. /resultados is the Spanish alias.
[[redirects]]
  from = "/results"
  to = "/results.html"
  status = 200

[[redirects]]
  from = "/resultados"
  to = "/results.html"
  status = 200

# The 2026 event has wrapped: the old ticket links now land on the results.
[[redirects]]
  from = "/tickets"
  to = "/results"
  status = 302
  force = true

[[redirects]]
  from = "/tickets.html"
  to = "/results"
  status = 301
  force = true

[[redirects]]
  from = "/boletos"
  to = "/resultados"
  status = 302
  force = true

# Founding vendor page. /vendedores is the Spanish alias.
[[redirects]]
  from = "/vendors"
  to = "/vendors.html"
  status = 200

[[redirects]]
  from = "/vendedores"
  to = "/vendors.html"
  status = 200

# Guest survey (Zoho embed, closes Mon Oct 12 2026). /encuesta is the Spanish alias.
# Query strings pass through, so /survey?src=wa still tags the channel.
[[redirects]]
  from = "/survey"
  to = "/survey.html"
  status = 200

[[redirects]]
  from = "/encuesta"
  to = "/survey.html"
  status = 200

# Old ticket short links (stage, door QR, coach texts, IG bio) now land on the results.
[[redirects]]
  from = "/buy"
  to = "/results"
  status = 302

[[redirects]]
  from = "/comprar"
  to = "/resultados"
  status = 302

# Function source lives under the publish dir; don't serve it as static files.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404

# The portal holds student data — keep it out of search engines entirely.
[[headers]]
  for = "/band.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/school.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
